<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-default="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>
/* Theme before first paint: the saved choice, else the page's default; "auto" follows the system. */
(function () {
  var root = document.documentElement, pref = null;
  try { pref = localStorage.getItem('ospf-explorer:theme'); } catch (e) { /* storage blocked */ }
  if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') pref = root.getAttribute('data-theme-default') || 'auto';
  var light = pref === 'light' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  root.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<style>
:root{--font:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
/* Colour tokens. The page sets data-theme="dark" or "light" on <html> (see the script in <head>). */
[data-theme="dark"]{color-scheme:dark;--bg:#0b1324;--panel:#111b2f;--panel2:#16233b;--line:#22324d;--text:#e6edf7;--strong:#ffffff;--muted:#8da2c0;
--accent:#3b82f6;--crit:#ef4444;--warn:#f59e0b;--info:#60a5fa;--ok:#22c55e;--dot:#1a2a45;--glass:#0b1324cc;--tip:#0b1324f2;--on:#1e3a66;--hover:#1b2c49;
--shadow:#0009;--c-crit:#fca5a5;--c-warn:#fcd34d;--c-orange:#fdba74;--c-info:#93c5fd;--t-ok:#4ade80;--t-y:#facc15;--t-o:#fb923c;--t-r:#f87171;--logo:#60a5fa;--sim-bg:#2a2108f2;--sim-path:#38bdf8;--sim-rev:#e879f9}
[data-theme="light"]{color-scheme:light;--bg:#f8fafc;--panel:#ffffff;--panel2:#f1f5f9;--line:#e2e8f0;--text:#0f172a;--strong:#020617;--muted:#64748b;
--accent:#2563eb;--crit:#dc2626;--warn:#d97706;--info:#2563eb;--ok:#16a34a;--dot:#cbd5e1;--glass:#f8fafccc;--tip:#fffffff2;--on:#dbeafe;--hover:#e8eef8;
--shadow:#0f172a26;--c-crit:#b91c1c;--c-warn:#b45309;--c-orange:#c2410c;--c-info:#1d4ed8;--t-ok:#15803d;--t-y:#a16207;--t-o:#c2410c;--t-r:#b91c1c;--logo:#2563eb;--sim-bg:#fff7e0f2;--sim-path:#0284c7;--sim-rev:#c026d3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--on);border-color:var(--accent)}
#top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:16px;letter-spacing:.06em;margin:0;font-weight:700;flex:1}
#top svg{width:30px;height:30px;stroke:var(--logo)}
#b-theme{min-width:42px;font-size:15px;line-height:1}
#app{display:flex;height:calc(100% - 52px)}
#side{width:340px;min-width:260px;max-width:50%;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
#side.collapsed{display:none}
#side h2{font-size:15px;margin:2px 0 10px}
#side h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.card{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;margin:0 0 6px;padding:9px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.card:hover{border-color:var(--accent)}
.card .ico{flex:0 0 auto;font-weight:700}
.card small{display:block;color:var(--muted)}
.card.crit{color:var(--c-crit)}.card.warn{color:var(--c-warn)}.card.orange{color:var(--c-orange)}.card.info{color:var(--c-info)}.card.plain{color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:2px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;cursor:pointer;user-select:none}
.chip.off{opacity:.4}
details.group{margin:0 0 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
details.group>summary{cursor:pointer;padding:7px 10px;list-style:none;display:flex;gap:8px;align-items:center}
details.group>summary::-webkit-details-marker{display:none}
details.group .n{margin-left:auto;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:6px 10px;font-size:12px}
.row:hover{background:var(--hover)}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px}
.dot.critical{background:var(--crit)}.dot.warning{background:var(--warn)}.dot.info{background:var(--info)}
.legend{display:grid;grid-template-columns:34px 1fr;gap:5px 10px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{display:block;height:0;border-top:3px solid}
.legend i.dash{border-top-style:dashed}.legend i.dot2{border-top-style:dotted}
.legend b{display:inline-block;width:20px;height:13px;border-radius:3px}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
#bar{position:absolute;z-index:3;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
#summary{font-weight:600;background:var(--glass);padding:6px 10px;border-radius:8px}
#bar .sp{flex:1;pointer-events:none}
#q{width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;background:
 radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/28px 28px,var(--bg)}
#canvas.panning{cursor:grabbing}
#tip{position:absolute;z-index:5;pointer-events:none;display:none;max-width:380px;background:var(--tip);border:1px solid var(--line);border-radius:9px;padding:9px 12px;box-shadow:0 8px 28px var(--shadow);font-size:12px}
#tip b{color:var(--strong)}#tip .k{color:var(--muted)}
#tip .ok{color:var(--t-ok)}#tip .y{color:var(--t-y)}#tip .o{color:var(--t-o)}#tip .r{color:var(--t-r)}
.panel{position:absolute;z-index:6;right:14px;top:56px;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 36px var(--shadow)}
.panel.hidden{display:none}
.panel label{display:flex;gap:8px;align-items:center;margin:5px 0}
.panel h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel input[type=number]{width:56px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#toast{position:absolute;z-index:7;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tip);border:1px solid var(--line);border-radius:99px;padding:7px 16px;display:none}
#sel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:12px}
#sel.hidden{display:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
/* ---- what-if simulation ---- */
#b-sim.on{background:var(--warn);border-color:var(--warn);color:#1a1200;font-weight:700}
#sim-bar{position:absolute;z-index:4;left:14px;right:14px;top:54px;display:none;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--sim-bg);border:1.5px solid var(--warn);box-shadow:0 8px 28px var(--shadow)}
#sim-bar.on{display:flex}
.sim-badge{font-weight:800;letter-spacing:.07em;font-size:11px;padding:3px 10px;border-radius:99px;background:var(--warn);color:#1a1200;white-space:nowrap}
#sim-bar label{display:flex;gap:5px;align-items:center;color:var(--muted);font-weight:600}
#sim-bar select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:170px}
.sim-metrics{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:220px}
.sim-chip{padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap}
.sim-chip.bad{color:var(--c-crit);border-color:var(--crit);font-weight:700}
.sim-chip.warn{color:var(--c-warn);border-color:var(--warn)}
.sim-chip.ok{color:var(--t-ok);border-color:var(--ok)}
.sim-chip.rev{color:var(--sim-rev);border-color:var(--sim-rev);font-weight:700}
.sim-chip.dim{color:var(--muted)}
.sim-chip.undo{cursor:pointer}.sim-chip.undo:hover{border-color:var(--crit)}
#sim-diff{flex-basis:100%;display:none;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;color:var(--muted)}
#sim-diff b{color:var(--strong)}#sim-diff .cut{color:var(--c-crit)}#sim-diff .new{color:var(--sim-path)}
#sim-changes{flex-basis:100%;display:none;gap:6px;flex-wrap:wrap}
#sim-pop{position:absolute;z-index:8;display:none;width:262px;background:var(--panel);border:1px solid var(--warn);border-radius:11px;padding:10px 12px;box-shadow:0 12px 36px var(--shadow);font-size:12px}
#sim-pop h5{margin:0 0 2px;font-size:13px;color:var(--strong)}
#sim-pop .sub{color:var(--muted);margin-bottom:6px}
#sim-pop button{display:block;width:100%;text-align:left;margin:4px 0}
#sim-pop .r2{display:flex;gap:6px;align-items:center;margin:5px 0}
#sim-pop .r2 button{width:auto;margin:0;flex:0 0 auto}
#sim-pop input[type=number]{width:74px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#sim-pop select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:100%}
#sim-pop .x{position:absolute;right:8px;top:6px;width:auto;border:0;background:transparent;padding:0 4px;margin:0}
#sim-pop .note{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);color:var(--text)}
#sim-pop .note.bad{color:var(--c-crit)}#sim-pop .note.ok{color:var(--t-ok)}
#simfx,#simtop{pointer-events:none}
.sim-path-active,.sim-path-rev{animation:simflow .9s linear infinite}
.sim-path-rev{animation-direction:normal}
@keyframes simflow{to{stroke-dashoffset:-19}}
@media (prefers-reduced-motion:reduce){.sim-path-active,.sim-path-rev{animation:none}}
@media print{#side,#top,#bar,#sim-bar,#sim-pop{display:none}#app{height:100%}}
</style>
</head>
<body>
<header id="top">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="16" cy="16" r="3.2"/><circle cx="16" cy="4.5" r="2.2"/><circle cx="26" cy="10" r="2.2"/><circle cx="26" cy="22" r="2.2"/><circle cx="16" cy="27.5" r="2.2"/><circle cx="6" cy="22" r="2.2"/><circle cx="6" cy="10" r="2.2"/><path d="M16 6.7v6M24.1 11l-5.4 3.2M24.1 21l-5.4-3.2M16 25.3v-6M7.9 21l5.4-3.2M7.9 11l5.4 3.2"/></svg>
  <h1>OSPF TOPOLOGY EXPLORER</h1>
  <button id="b-search" title="Search (/)">Search</button>
  <button id="b-filter" title="Filters and display options">Filter</button>
  <button id="b-sim" title="What-if simulation: shut links or routers, change costs, drain a router - nothing is sent to any device">Simulate</button>
  <button id="b-side" title="Show / hide the sidebar">Panel</button>
  <button id="b-theme" title="Theme">&#x25D0;</button>
  <button id="b-full" title="Full screen">&#x26F6;</button>
  <button id="b-more" title="Layout and export">&#9881;</button>
</header>
<div id="app">
  <aside id="side">
    <div id="sel" class="hidden"></div>
    <div id="simside"></div>
    <h2>Diagnostics &amp; Warnings</h2>
    <div id="diag"></div>
    <div id="trace"></div>
    <h3>Cross-check findings</h3>
    <div class="chips" id="sevchips"></div>
    <div id="findings"></div>
    <h3>Topology legend</h3>
    <div class="legend" id="legend"></div>
  </aside>
  <main id="stage">
    <div id="bar">
      <span id="summary"></span><span class="sp"></span>
      <input id="q" type="search" placeholder="Search router, prefix, area&hellip;" autocomplete="off">
      <button id="b-reset" title="Forget dragged positions and restore the computed layout">Reset Layout</button>
      <button id="b-zin" title="Zoom in">+</button><button id="b-zout" title="Zoom out">&minus;</button><button id="b-fit" title="Fit to screen (f)">fit</button>
    </div>
    <div id="sim-bar" role="region" aria-label="What-if simulation">
      <span class="sim-badge">SIMULATION MODE ACTIVE</span>
      <label>Source A <select id="sim-a"></select></label>
      <button id="sim-swap" title="Swap source and target">&#8644;</button>
      <label>Target B <select id="sim-b"></select></label>
      <span class="sim-metrics" id="sim-metrics"></span>
      <button id="sim-reset" title="Undo every simulated change and show the real network again">Reset Simulation</button>
      <button id="sim-exit" title="Leave simulation mode (discards the simulated changes)">Exit</button>
      <div id="sim-diff"></div>
      <div id="sim-changes"></div>
    </div>
    <div id="sim-pop"></div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0"><g id="vp"><g id="areas"></g><g id="links"></g><g id="simfx"></g><g id="labels"></g><g id="nodes"></g><g id="simtop"></g></g></svg>
    <div id="tip"></div>
    <div id="toast"></div>
    <div class="panel hidden" id="p-filter">
      <h4>Show</h4>
      <label><input type="checkbox" id="f-oneway" checked> One-way links</label>
      <label><input type="checkbox" id="f-costs" checked> Cost labels (collision-free)</label>
      <label><input type="checkbox" id="f-ifaces"> Interface labels always</label>
      <label><input type="checkbox" id="f-areas" checked> Area boxes</label>
      <h4>Bundle</h4>
      <label><input type="checkbox" id="f-bundle"> Bundle leaf routers of a segment, from <input type="number" id="f-bundlemin" min="2" max="99" value="6"></label>
      <h4>Areas</h4>
      <div id="f-arealist"></div>
    </div>
    <div class="panel hidden" id="p-more">
      <h4>Layout</h4>
      <button id="m-export">Export layout (JSON)</button>
      <button id="m-import">Import layout&hellip;</button>
      <input id="m-file" type="file" accept="application/json" hidden>
      <p class="mono" style="color:var(--muted);font-size:11px">Dragged positions are remembered in this browser, per node ID.</p>
      <h4>Picture</h4>
      <button id="m-svg">Download SVG</button>
    </div>
  </main>
</div>
<script type="application/json" id="scene">/*__SCENE__*/null</script>
<script>
(function () {
'use strict';
var SCENE = JSON.parse(document.getElementById('scene').textContent);
var NS = 'http://www.w3.org/2000/svg';
var $ = function (id) { return document.getElementById(id); };

// ------------------------------------------------------------------ palette (SVG uses attributes, not CSS variables)
var PAL = {
  dark: {
    router: '#1d4ed8', routerEdge: '#93c5fd', abr: '#fbbf24', net: '#f5b335', netEdge: '#fde68a', ghost: '#cbd5e1', ghostFill: '#e2e8f0',
    text: '#f8fafc', subText: '#bfdbfe', dark: '#0f172a', muted: '#8da2c0', countText: '#ffffff',
    link: '#6b7f9c', oneway: '#a78bfa', added: '#22c55e', removed: '#ef4444', changed: '#f59e0b', unverified: '#94a3b8',
    full: '#22c55e', twoway: '#eab308', stuck: '#f97316', down: '#ef4444', path: '#38bdf8', focus: '#f43f5e', area: '#4f7fb0',
    areaFill: '#10203a', areaFillOpacity: 0.35, areaLabel: '#9cc0e6', bundleA: '#1e3a8a', bundleB: '#1e40af',
    pillBg: '#0b1324', pillOpacity: 0.88, pillText: '#e6edf7', pillEdge: '#64748b', exportBg: '#0b1324',
    simPath: '#38bdf8', simRev: '#e879f9', simBad: '#ef4444', simWarn: '#f59e0b'
  },
  light: {
    router: '#1d4ed8', routerEdge: '#1e3a8a', abr: '#d97706', net: '#fbbf24', netEdge: '#b45309', ghost: '#64748b', ghostFill: '#e2e8f0',
    text: '#ffffff', subText: '#dbeafe', dark: '#0f172a', muted: '#64748b', countText: '#ffffff',
    link: '#64748b', oneway: '#7c3aed', added: '#16a34a', removed: '#dc2626', changed: '#c2670a', unverified: '#64748b',
    full: '#16a34a', twoway: '#a16207', stuck: '#ea580c', down: '#dc2626', path: '#0284c7', focus: '#e11d48', area: '#3b82f6',
    areaFill: '#dbeafe', areaFillOpacity: 0.5, areaLabel: '#1d4ed8', bundleA: '#93c5fd', bundleB: '#60a5fa',
    pillBg: '#ffffff', pillOpacity: 0.95, pillText: '#0f172a', pillEdge: '#94a3b8', exportBg: '#f8fafc',
    simPath: '#0284c7', simRev: '#c026d3', simBad: '#dc2626', simWarn: '#c2670a'
  }
};
var C = PAL.dark;   // the palette in use; applyTheme() swaps it
var STATE_COLOR = { 'Full': C.full, '2-Way': C.twoway, 'Loading': C.stuck, 'Exchange': C.stuck, 'ExStart': C.stuck };
function stateColor(s) { return s ? (STATE_COLOR[s] || C.down) : null; }
function stateClass(s) { return !s ? '' : s === 'Full' ? 'ok' : s === '2-Way' ? 'y' : STATE_COLOR[s] ? 'o' : 'r'; }
function stateWord(s) {
  if (!s) return 'no neighbour data';
  var c = s === 'Full' ? 'Green' : s === '2-Way' ? 'Yellow' : STATE_COLOR[s] ? 'Orange' : 'Red';
  return s.toUpperCase() + ' (' + c + ')';
}

// ------------------------------------------------------------------ model
var nodes = {}, links = {}, adj = {};
SCENE.nodes.forEach(function (n) { nodes[n.id] = n; adj[n.id] = []; });
SCENE.links.forEach(function (l) { links[l.id] = l; if (adj[l.a]) adj[l.a].push(l.id); if (adj[l.b]) adj[l.b].push(l.id); });
var STORE = 'ospf-explorer:layout:v1:' + (SCENE.meta.scope || 'default');
var pos = {};            // current centre of every node
var state = {
  view: { x: 0, y: 0, k: 1 },
  sel: null,             // {type:'node'|'link', id}
  focus: null,           // {nodes:[], links:[], label}
  matches: null,         // Set of node ids matching the search
  show: { oneWay: true, costs: true, ifaces: false, areas: true },
  bundle: { on: false, min: 6, expanded: {} },
  hiddenAreas: {},
  sev: { critical: true, warning: true, info: false },   // information is listed on request: it is the noisy kind
  hover: null
};

function loadSaved() {
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
  return saved;
}
function saveLayout() {
  var out = {};
  SCENE.nodes.forEach(function (n) {
    var p = pos[n.id];
    if (Math.abs(p.x - n.x) > .5 || Math.abs(p.y - n.y) > .5) out[n.id] = [Math.round(p.x), Math.round(p.y)];
  });
  try { if (Object.keys(out).length) localStorage.setItem(STORE, JSON.stringify(out)); else localStorage.removeItem(STORE); } catch (e) { /* private mode */ }
}
function resetPositions(useSaved) {
  var saved = useSaved ? loadSaved() : {};
  SCENE.nodes.forEach(function (n) {
    var s = saved[n.id];
    pos[n.id] = s ? { x: s[0], y: s[1] } : { x: n.x, y: n.y };
  });
}

// ------------------------------------------------------------------ what-if engine (pure: no DOM, no page state)
/* SIM-ENGINE:BEGIN - tests/js/test_simulation.js runs exactly this block, so keep it free of page globals */
var SIM_MAX_METRIC = 65535, SIM_PATH_LIMIT = 16;
var SIM_NONE = { disabledLinks: new Set(), disabledNodes: new Set(), costOverrides: new Map(), drainedNodes: new Set() };
var simDefaultModel = null;
function simSetModel(model) { simDefaultModel = model; }
function simMods(m) {
  m = m || {};
  return { disabledLinks: m.disabledLinks || SIM_NONE.disabledLinks, disabledNodes: m.disabledNodes || SIM_NONE.disabledNodes,
    costOverrides: m.costOverrides || SIM_NONE.costOverrides, drainedNodes: m.drainedNodes || SIM_NONE.drainedNodes };
}

// What the SPF pays to cross a link in each direction (null = it cannot). The exporter computes this with the rules of the
// Python SPF; for a scene without it, derive the same numbers from the link ends.
function simLinkCosts(l) {
  if (l.spf) return l.spf;
  var out = { ab: null, ba: null };
  if (l.oneWay || l.status === 'removed') return out;
  (l.ends || []).forEach(function (e) {
    if (typeof e.metric !== 'number') return;
    if (e.from === l.a && e.to === l.b) out.ab = e.metric; else if (e.from === l.b && e.to === l.a) out.ba = e.metric;
  });
  if (l.kind === 'segment') { if (out.ab !== null && out.ba === null) out.ba = 0; else if (out.ba !== null && out.ab === null) out.ab = 0; }
  return out;
}

// Directed graph for Dijkstra. Router -> router and router -> network edges cost the advertised metric; network -> router
// edges (`attach`) cost 0 and cannot be tuned: a transit network is a node of its own, exactly as in the LSDB.
function makeGraphModel(scene) {
  var nodes = {}, edges = [], out = {}, byLink = {}, routers = [];
  scene.nodes.forEach(function (n) { nodes[n.id] = n; out[n.id] = []; if (n.kind === 'router' && n.status !== 'removed') routers.push(n.id); });
  scene.links.forEach(function (l) {
    var costs = simLinkCosts(l); byLink[l.id] = [];
    [['ab', l.a, l.b], ['ba', l.b, l.a]].forEach(function (d) {

  if (deg > 90 || deg < -90) deg += 180;
  var g = svg('g', { transform: 'translate(' + x + ',' + y + ') rotate(' + deg + ')', 'class': cls || null }, parent);
  svg('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: C.pillBg, 'fill-opacity': .96, stroke: edge, 'stroke-width': 1.6 / k }, g);
  var t = svg('text', { x: 0, y: size * .36, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 700, 'font-family': 'sans-serif', fill: edge }, g);
  t.textContent = text;
  return g;
}
function drawSimFx() {
  gSimFx.textContent = gSimTop.textContent = '';
  model.links.forEach(function (l) { if (l.el && !l.virtual) l.el.vis.setAttribute('stroke-opacity', sim.active && sim.disabledLinks.has(l.id) ? .12 : linkStyle(l).opacity); });
  if (!sim.active || !simRes) return;
  var r = simRes, k = state.view.k, visible = {}, mnode = {};
  model.links.forEach(function (l) { if (!l.virtual && l.geo) visible[l.id] = 1; });
  model.nodes.forEach(function (n) { mnode[n.id] = n; });
  function hops(p, off, attrs, cls, glow) {
    for (var i = 0; i < p.links.length; i++) {
      var seg = simSegment(p.nodes[i], p.links[i], off, visible);
      if (!seg) continue;
      if (glow) simLine(gSimFx, seg, { stroke: attrs.stroke, 'stroke-width': attrs['stroke-width'] + 8, 'stroke-opacity': .22 });
      simLine(gSimFx, seg, attrs, cls);
    }
  }
  // 1. the path that existed before and is gone now: faded red, dashed
  if (r.forward && r.lost.length) {
    r.forward.before.paths.forEach(function (p) {
      p.links.forEach(function (lid, i) { if (r.lost.indexOf(lid) < 0) return; var seg = simSegment(p.nodes[i], lid, 0, visible); if (seg) simLine(gSimFx, seg, { stroke: C.simBad, 'stroke-width': 5, 'stroke-opacity': .5, 'stroke-dasharray': '3 8' }, 'sim-lost'); });
    });
  }
  // 2. the live path A -> B (cyan) and, when it differs, the way back (magenta)
  if (r.forward && r.forward.after.reachable) {
    r.forward.after.paths.forEach(function (p) { hops(p, r.asymmetric ? -3 : 0, { stroke: C.simPath, 'stroke-width': 4.5, 'stroke-dasharray': '11 8' }, 'sim-path-active', true); });
    if (r.asymmetric) r.reverse.after.paths.forEach(function (p) { hops(p, 3, { stroke: C.simRev, 'stroke-width': 4.5, 'stroke-dasharray': '11 8' }, 'sim-path-rev', true); });
  }
  // 3. links that are down: red dashed with an X; links with a changed cost: amber pill "old -> new" (X and pill sit above the
  //    routers so a short link cannot hide them)
  var rad = Math.max(7, Math.min(15, 10 / k));
  model.links.forEach(function (l) {
    if (l.virtual || !l.geo) return;
    var e = l.geo, mx = (e.pa.x + e.pb.x) / 2, my = (e.pa.y + e.pb.y) / 2, deg = e.ang * 180 / Math.PI;
    if (sim.disabledLinks.has(l.id)) {
      simLine(gSimFx, [e.pa, e.pb], { stroke: C.simBad, 'stroke-width': 3.4, 'stroke-dasharray': '9 6' }, 'sim-disabled');
      var g = svg('g', { 'class': 'sim-disabled' }, gSimTop);
      svg('circle', { cx: mx, cy: my, r: rad, fill: C.pillBg, stroke: C.simBad, 'stroke-width': 2 }, g);
      var d = rad * .5;
      svg('line', { x1: mx - d, y1: my - d, x2: mx + d, y2: my + d, stroke: C.simBad, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
      svg('line', { x1: mx - d, y1: my + d, x2: mx + d, y2: my - d, stroke: C.simBad, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
      return;
    }
    var parts = [], flip = deg > 90 || deg < -90;
    simTunable(l).forEach(function (ed) {
      var v = simOverride(l, ed);
      if (typeof v !== 'number') return;
      var arrow = (ed.dir === 'ab') !== flip ? '\u25b8' : '\u25c2';
      parts.push((simTunable(l).length > 1 ? arrow + ' ' : '') + ed.cost + '\u2192' + v);
    });
    if (parts.length) {
      var lab = simPill(gSimTop, mx, my, deg, parts.join('   '), C.simWarn, 'sim-overridden');
      lab.setAttribute('title', 'Cost changed by the simulation');
    }
  });
  // 4. nodes: isolated (red ring + badge), down (X), drained (amber tag), and the A / B ends
  function around(id, draw) {
    var n = mnode[id], p = pos[id];
    if (!n || !p) return;
    draw(svg('g', { transform: 'translate(' + p.x + ',' + p.y + ')' }, gSimTop), n.w / 2, n.h / 2, n);
  }
  function badge(g, x, y, text, fill, ring) {
    svg('circle', { cx: x, cy: y, r: 11, fill: fill, stroke: ring, 'stroke-width': 2 }, g);
    var t = svg('text', { x: x, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, 'font-family': 'sans-serif', fill: '#ffffff' }, g);
    t.textContent = text;
  }
  r.isolated.forEach(function (id) {
    around(id, function (g, hw, hh) {
      svg('rect', { x: -hw - 7, y: -hh - 7, width: hw * 2 + 14, height: hh * 2 + 14, rx: 14, fill: 'none', stroke: C.simBad, 'stroke-width': 3.5, 'stroke-dasharray': '7 5' }, g);
      badge(g, hw + 2, -hh - 2, '!', C.simBad, C.pillBg);
    });
  });
  sim.disabledNodes.forEach(function (id) {
    around(id, function (g, hw, hh) {
      svg('line', { x1: -hw, y1: -hh, x2: hw, y2: hh, stroke: C.simBad, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
      svg('line', { x1: -hw, y1: hh, x2: hw, y2: -hh, stroke: C.simBad, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
      simPill(g, 0, hh + 16, 0, 'DOWN', C.simBad);
    });
  });
  sim.drainedNodes.forEach(function (id) { around(id, function (g, hw, hh) { simPill(g, 0, -hh - 16, 0, 'DRAIN ' + SIM_MAX_METRIC, C.simWarn); }); });
  [[sim.sourceNode, 'A', C.simPath], [sim.targetNode, 'B', C.simWarn]].forEach(function (x) {
    if (x[0]) around(x[0], function (g, hw, hh) { badge(g, -hw - 2, -hh - 2, x[1], C.dark, x[2]); });
  });
}

// ---- popovers (click a link or a router while simulating)
function closeSimPopover() { popEl.style.display = 'none'; popAt = null; }
function popBtn(parent, text, fn, title) {
  var b = document.createElement('button'); b.textContent = text; if (title) b.title = title;
  b.addEventListener('click', function (ev) { ev.stopPropagation(); fn(); });
  parent.appendChild(b); return b;
}
function popText(parent, cls, text) { var d = document.createElement('div'); d.className = cls; d.textContent = text; parent.appendChild(d); return d; }
function openSimPopover(kind, id, ev) {
  var stage = $('stage').getBoundingClientRect();
  if (kind) popAt = { kind: kind, id: id, x: ev ? ev.clientX - stage.left : (popAt ? popAt.x : 40), y: ev ? ev.clientY - stage.top : (popAt ? popAt.y : 80) };
  if (!popAt) return;
  popEl.textContent = '';
  var x = document.createElement('button'); x.className = 'x'; x.textContent = '\u00d7'; x.title = 'Close (Esc)'; x.onclick = closeSimPopover; popEl.appendChild(x);
  if (popAt.kind === 'link') linkPopover(links[popAt.id]); else nodePopover(nodes[popAt.id]);
  popEl.style.display = 'block';
  popEl.style.left = Math.max(8, Math.min(popAt.x + 14, stage.width - 280)) + 'px';
  popEl.style.top = Math.max(8, Math.min(popAt.y + 14, stage.height - popEl.offsetHeight - 10)) + 'px';
}
function linkPopover(l) {
  var h = document.createElement('h5'); h.textContent = simLinkName(l); popEl.appendChild(h);
  var down = sim.disabledLinks.has(l.id), tun = simTunable(l);
  popText(popEl, 'sub', down ? 'DOWN in the simulation' : (tun.length ? tun.map(function (e) { var v = simEdgeNow(e); return simTitle(e.from) + ' \u2192 ' + simTitle(e.to) + ': ' + (v !== e.cost ? e.cost + ' \u2192 ' + v : v); }).join('  \u00b7  ') : 'not used by the SPF (one-way or removed)'));
  popBtn(popEl, down ? 'Toggle Link Up (enable)' : 'Toggle Link Down (shut)', function () { simToggleLink(l.id); });
  if (!tun.length) return;
  var dirSel = document.createElement('select');
  if (tun.length > 1) { var o = document.createElement('option'); o.value = 'both'; o.textContent = 'both directions'; dirSel.appendChild(o); }
  tun.forEach(function (e) { var o2 = document.createElement('option'); o2.value = e.dir; o2.textContent = simTitle(e.from) + ' \u2192 ' + simTitle(e.to) + ' only'; dirSel.appendChild(o2); });
  var row = document.createElement('div'); row.className = 'r2'; popEl.appendChild(row);
  var inp = document.createElement('input'); inp.type = 'number'; inp.min = 1; inp.max = SIM_MAX_METRIC; inp.step = 1; inp.value = simEdgeNow(tun[0]); inp.title = 'Cost, 1 to ' + SIM_MAX_METRIC;
  inp.addEventListener('keydown', function (ev) { ev.stopPropagation(); if (ev.key === 'Enter') simSetCost(l.id, dirSel.value, parseInt(inp.value, 10)); });
  row.appendChild(document.createTextNode('Cost')); row.appendChild(inp);
  var set = document.createElement('button'); set.textContent = 'Set'; set.onclick = function (ev) { ev.stopPropagation(); simSetCost(l.id, dirSel.value, parseInt(inp.value, 10)); }; row.appendChild(set);
  popEl.appendChild(dirSel);
  popBtn(popEl, 'Set Max-Metric (' + SIM_MAX_METRIC + ')', function () { simSetCost(l.id, dirSel.value, SIM_MAX_METRIC); }, 'Drain traffic off this link: it stays up, but every path prefers another way');
  if (sim.costOverrides.has(l.id)) popBtn(popEl, 'Revert cost', function () { simClearCost(l.id); });
}
function nodePopover(n) {
  var h = document.createElement('h5'); h.textContent = n.title; popEl.appendChild(h);
  var down = sim.disabledNodes.has(n.id), drained = sim.drainedNodes.has(n.id), isRouter = n.kind === 'router';
  popText(popEl, 'sub', (isRouter ? 'Router' : 'Transit network') + (down ? ' \u00b7 DOWN in the simulation' : '') + (drained ? ' \u00b7 drained' : ''));
  if (isRouter) {
    popBtn(popEl, sim.sourceNode === n.id ? 'Source (A) \u2713 - click to clear' : 'Set as Path Source (A)', function () { simSetSource(sim.sourceNode === n.id ? null : n.id); });
    popBtn(popEl, sim.targetNode === n.id ? 'Target (B) \u2713 - click to clear' : 'Set as Path Target (B)', function () { simSetTarget(sim.targetNode === n.id ? null : n.id); });
  }
  popBtn(popEl, down ? 'Toggle Node Up (power on)' : 'Toggle Node Down (reboot / outage)', function () { simToggleNode(n.id); simDrain = null; });
  if (isRouter) {
    popBtn(popEl, drained ? 'Remove Max-Metric Router LSA' : 'Set Max-Metric Router LSA (Drain Router)', function () {
      simToggleDrain(n.id);
      simDrain = sim.drainedNodes.has(n.id) ? simDrainImpact(GM, n.id, sim.sourceNode, sim) : null;
      openSimPopover();
    }, 'The router advertises ' + SIM_MAX_METRIC + ' on all its own links (RFC 3137): transit traffic moves away, its own networks stay reachable');
    if (simDrain && simDrain.node === n.id && drained) {
      var s = simDrain, box = document.createElement('div');
      var risky = s.stranded.length;
      box.className = 'note ' + (risky ? 'bad' : 'ok');
      box.textContent = (risky
        ? simPlural(s.stranded.length, 'router') + ' (' + simPlural(s.strandedPrefixes, 'stub network') + ') hang only off this router: ' + s.stranded.map(simTitle).join(', ') + '. Their traffic cannot drain, and shutting it would cut them off.'
        : 'Every other router has another way: safe to shut this one once the drain has converged.')
        + (s.stillTransit.length ? ' ' + simPlural(s.stillTransit.length, 'router') + ' still route through it at cost ' + SIM_MAX_METRIC + '+.' : '') + ' (seen from ' + simTitle(s.from) + ')';
      popEl.appendChild(box);
    }
  }
}

// ---- wiring
(function () {
  var a = $('sim-a'), b = $('sim-b');
  [a, b].forEach(function (sel) {
    var o = document.createElement('option'); o.value = ''; o.textContent = '\u2014 pick a router \u2014'; sel.appendChild(o);
    GM.routers.slice().sort(function (x, y) { return simTitle(x) < simTitle(y) ? -1 : 1; }).forEach(function (id) { var e = document.createElement('option'); e.value = id; e.textContent = simTitle(id); sel.appendChild(e); });
  });
  a.onchange = function () { simSetSource(a.value); };
  b.onchange = function () { simSetTarget(b.value); };
  $('sim-swap').onclick = function () { var t = sim.sourceNode; sim.sourceNode = sim.targetNode; sim.targetNode = t; simRefresh(); };
  $('sim-reset').onclick = simReset;
  $('sim-exit').onclick = function () { simSetActive(false); };
  $('b-sim').onclick = function () { simSetActive(!sim.active); };
})();

// ------------------------------------------------------------------ go
resetPositions(true);
applyTheme(savedTheme() || SCENE.meta.theme || 'auto', false);
buildHeader(); buildDiagnostics(); buildFindings(); buildLegend();
render(); fit();
ready = true;
window.__explorer = { sim: sim, simApi: { setActive: simSetActive, reset: simReset, toggleLink: simToggleLink, toggleNode: simToggleNode, toggleDrain: simToggleDrain, setCost: simSetCost, setSource: simSetSource, setTarget: simSetTarget, refresh: simRefresh, result: function () { return simRes; }, drainImpact: simDrainImpact }, graphModel: GM, palette: function () { return C; }, state: state, nodes: nodes, links: links, pos: pos, render: render, fit: fit, focusOn: focusOn, select: select, runSearch: runSearch, model: function () { return model; } };
})();
