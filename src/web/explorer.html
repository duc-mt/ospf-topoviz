<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-default="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>
/* Theme before first paint: the saved choice, else the page's default; "auto" follows the system. */
(function () {
  var root = document.documentElement, pref = null;
  try { pref = localStorage.getItem('ospf-explorer:theme'); } catch (e) { /* storage blocked */ }
  if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') pref = root.getAttribute('data-theme-default') || 'auto';
  var light = pref === 'light' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  root.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<style>
:root{--font:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
/* Colour tokens. The page sets data-theme="dark" or "light" on <html> (see the script in <head>). */
[data-theme="dark"]{color-scheme:dark;--bg:#0b1324;--panel:#111b2f;--panel2:#16233b;--line:#22324d;--text:#e6edf7;--strong:#ffffff;--muted:#8da2c0;
--accent:#3b82f6;--crit:#ef4444;--warn:#f59e0b;--info:#60a5fa;--ok:#22c55e;--dot:#1a2a45;--glass:#0b1324cc;--tip:#0b1324f2;--on:#1e3a66;--hover:#1b2c49;
--shadow:#0009;--c-crit:#fca5a5;--c-warn:#fcd34d;--c-orange:#fdba74;--c-info:#93c5fd;--t-ok:#4ade80;--t-y:#facc15;--t-o:#fb923c;--t-r:#f87171;--logo:#60a5fa}
[data-theme="light"]{color-scheme:light;--bg:#f8fafc;--panel:#ffffff;--panel2:#f1f5f9;--line:#e2e8f0;--text:#0f172a;--strong:#020617;--muted:#64748b;
--accent:#2563eb;--crit:#dc2626;--warn:#d97706;--info:#2563eb;--ok:#16a34a;--dot:#cbd5e1;--glass:#f8fafccc;--tip:#fffffff2;--on:#dbeafe;--hover:#e8eef8;
--shadow:#0f172a26;--c-crit:#b91c1c;--c-warn:#b45309;--c-orange:#c2410c;--c-info:#1d4ed8;--t-ok:#15803d;--t-y:#a16207;--t-o:#c2410c;--t-r:#b91c1c;--logo:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--on);border-color:var(--accent)}
#top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:16px;letter-spacing:.06em;margin:0;font-weight:700;flex:1}
#top svg{width:30px;height:30px;stroke:var(--logo)}
#b-theme{min-width:42px;font-size:15px;line-height:1}
#app{display:flex;height:calc(100% - 52px)}
#side{width:340px;min-width:260px;max-width:50%;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
#side.collapsed{display:none}
#side h2{font-size:15px;margin:2px 0 10px}
#side h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.card{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;margin:0 0 6px;padding:9px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.card:hover{border-color:var(--accent)}
.card .ico{flex:0 0 auto;font-weight:700}
.card small{display:block;color:var(--muted)}
.card.crit{color:var(--c-crit)}.card.warn{color:var(--c-warn)}.card.orange{color:var(--c-orange)}.card.info{color:var(--c-info)}.card.plain{color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:2px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;cursor:pointer;user-select:none}
.chip.off{opacity:.4}
details.group{margin:0 0 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
details.group>summary{cursor:pointer;padding:7px 10px;list-style:none;display:flex;gap:8px;align-items:center}
details.group>summary::-webkit-details-marker{display:none}
details.group .n{margin-left:auto;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:6px 10px;font-size:12px}
.row:hover{background:var(--hover)}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px}
.dot.critical{background:var(--crit)}.dot.warning{background:var(--warn)}.dot.info{background:var(--info)}
.legend{display:grid;grid-template-columns:34px 1fr;gap:5px 10px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{display:block;height:0;border-top:3px solid}
.legend i.dash{border-top-style:dashed}.legend i.dot2{border-top-style:dotted}
.legend b{display:inline-block;width:20px;height:13px;border-radius:3px}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
#bar{position:absolute;z-index:3;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
#summary{font-weight:600;background:var(--glass);padding:6px 10px;border-radius:8px}
#bar .sp{flex:1;pointer-events:none}
#q{width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;background:
 radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/28px 28px,var(--bg)}
#canvas.panning{cursor:grabbing}
#tip{position:absolute;z-index:5;pointer-events:none;display:none;max-width:380px;background:var(--tip);border:1px solid var(--line);border-radius:9px;padding:9px 12px;box-shadow:0 8px 28px var(--shadow);font-size:12px}
#tip b{color:var(--strong)}#tip .k{color:var(--muted)}
#tip .ok{color:var(--t-ok)}#tip .y{color:var(--t-y)}#tip .o{color:var(--t-o)}#tip .r{color:var(--t-r)}
.panel{position:absolute;z-index:6;right:14px;top:56px;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 36px var(--shadow)}
.panel.hidden{display:none}
.panel label{display:flex;gap:8px;align-items:center;margin:5px 0}
.panel h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel input[type=number]{width:56px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#toast{position:absolute;z-index:7;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tip);border:1px solid var(--line);border-radius:99px;padding:7px 16px;display:none}
#sel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:12px}
#sel.hidden{display:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
@media print{#side,#top,#bar{display:none}#app{height:100%}}
</style>
</head>
<body>
<header id="top">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="16" cy="16" r="3.2"/><circle cx="16" cy="4.5" r="2.2"/><circle cx="26" cy="10" r="2.2"/><circle cx="26" cy="22" r="2.2"/><circle cx="16" cy="27.5" r="2.2"/><circle cx="6" cy="22" r="2.2"/><circle cx="6" cy="10" r="2.2"/><path d="M16 6.7v6M24.1 11l-5.4 3.2M24.1 21l-5.4-3.2M16 25.3v-6M7.9 21l5.4-3.2M7.9 11l5.4 3.2"/></svg>
  <h1>OSPF TOPOLOGY EXPLORER</h1>
  <button id="b-search" title="Search (/)">Search</button>
  <button id="b-filter" title="Filters and display options">Filter</button>
  <button id="b-side" title="Show / hide the sidebar">Panel</button>
  <button id="b-theme" title="Theme">&#x25D0;</button>
  <button id="b-full" title="Full screen">&#x26F6;</button>
  <button id="b-more" title="Layout and export">&#9881;</button>
</header>
<div id="app">
  <aside id="side">
    <div id="sel" class="hidden"></div>
    <h2>Diagnostics &amp; Warnings</h2>
    <div id="diag"></div>
    <div id="trace"></div>
    <h3>Cross-check findings</h3>
    <div class="chips" id="sevchips"></div>
    <div id="findings"></div>
    <h3>Topology legend</h3>
    <div class="legend" id="legend"></div>
  </aside>
  <main id="stage">
    <div id="bar">
      <span id="summary"></span><span class="sp"></span>
      <input id="q" type="search" placeholder="Search router, prefix, area&hellip;" autocomplete="off">
      <button id="b-reset" title="Forget dragged positions and restore the computed layout">Reset Layout</button>
      <button id="b-zin" title="Zoom in">+</button><button id="b-zout" title="Zoom out">&minus;</button><button id="b-fit" title="Fit to screen (f)">fit</button>
    </div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0"><g id="vp"><g id="areas"></g><g id="links"></g><g id="labels"></g><g id="nodes"></g></g></svg>
    <div id="tip"></div>
    <div id="toast"></div>
    <div class="panel hidden" id="p-filter">
      <h4>Show</h4>
      <label><input type="checkbox" id="f-oneway" checked> One-way links</label>
      <label><input type="checkbox" id="f-costs" checked> Cost labels (collision-free)</label>
      <label><input type="checkbox" id="f-ifaces"> Interface labels always</label>
      <label><input type="checkbox" id="f-areas" checked> Area boxes</label>
      <h4>Bundle</h4>
      <label><input type="checkbox" id="f-bundle"> Bundle leaf routers of a segment, from <input type="number" id="f-bundlemin" min="2" max="99" value="6"></label>
      <h4>Areas</h4>
      <div id="f-arealist"></div>
    </div>
    <div class="panel hidden" id="p-more">
      <h4>Layout</h4>
      <button id="m-export">Export layout (JSON)</button>
      <button id="m-import">Import layout&hellip;</button>
      <input id="m-file" type="file" accept="application/json" hidden>
      <p class="mono" style="color:var(--muted);font-size:11px">Dragged positions are remembered in this browser, per node ID.</p>
      <h4>Picture</h4>
      <button id="m-svg">Download SVG</button>
    </div>
  </main>
</div>
<script type="application/json" id="scene">/*__SCENE__*/null</script>
<script>
(function () {
'use strict';
var SCENE = JSON.parse(document.getElementById('scene').textContent);
var NS = 'http://www.w3.org/2000/svg';
var $ = function (id) { return document.getElementById(id); };

// ------------------------------------------------------------------ palette (SVG uses attributes, not CSS variables)
var PAL = {
  dark: {
    router: '#1d4ed8', routerEdge: '#93c5fd', abr: '#fbbf24', net: '#f5b335', netEdge: '#fde68a', ghost: '#cbd5e1', ghostFill: '#e2e8f0',
    text: '#f8fafc', subText: '#bfdbfe', dark: '#0f172a', muted: '#8da2c0', countText: '#ffffff',
    link: '#6b7f9c', oneway: '#a78bfa', added: '#22c55e', removed: '#ef4444', changed: '#f59e0b', unverified: '#94a3b8',
    full: '#22c55e', twoway: '#eab308', stuck: '#f97316', down: '#ef4444', path: '#38bdf8', focus: '#f43f5e', area: '#4f7fb0',
    areaFill: '#10203a', areaFillOpacity: 0.35, areaLabel: '#9cc0e6', bundleA: '#1e3a8a', bundleB: '#1e40af',
    pillBg: '#0b1324', pillOpacity: 0.88, pillText: '#e6edf7', pillEdge: '#64748b', exportBg: '#0b1324'
  },
  light: {
    router: '#1d4ed8', routerEdge: '#1e3a8a', abr: '#d97706', net: '#fbbf24', netEdge: '#b45309', ghost: '#64748b', ghostFill: '#e2e8f0',
    text: '#ffffff', subText: '#dbeafe', dark: '#0f172a', muted: '#64748b', countText: '#ffffff',
    link: '#64748b', oneway: '#7c3aed', added: '#16a34a', removed: '#dc2626', changed: '#c2670a', unverified: '#64748b',
    full: '#16a34a', twoway: '#a16207', stuck: '#ea580c', down: '#dc2626', path: '#0284c7', focus: '#e11d48', area: '#3b82f6',
    areaFill: '#dbeafe', areaFillOpacity: 0.5, areaLabel: '#1d4ed8', bundleA: '#93c5fd', bundleB: '#60a5fa',
    pillBg: '#ffffff', pillOpacity: 0.95, pillText: '#0f172a', pillEdge: '#94a3b8', exportBg: '#f8fafc'
  }
};
var C = PAL.dark;   // the palette in use; applyTheme() swaps it
var STATE_COLOR = { 'Full': C.full, '2-Way': C.twoway, 'Loading': C.stuck, 'Exchange': C.stuck, 'ExStart': C.stuck };
function stateColor(s) { return s ? (STATE_COLOR[s] || C.down) : null; }
function stateClass(s) { return !s ? '' : s === 'Full' ? 'ok' : s === '2-Way' ? 'y' : STATE_COLOR[s] ? 'o' : 'r'; }
function stateWord(s) {
  if (!s) return 'no neighbour data';
  var c = s === 'Full' ? 'Green' : s === '2-Way' ? 'Yellow' : STATE_COLOR[s] ? 'Orange' : 'Red';
  return s.toUpperCase() + ' (' + c + ')';
}

// ------------------------------------------------------------------ model
var nodes = {}, links = {}, adj = {};
SCENE.nodes.forEach(function (n) { nodes[n.id] = n; adj[n.id] = []; });
SCENE.links.forEach(function (l) { links[l.id] = l; if (adj[l.a]) adj[l.a].push(l.id); if (adj[l.b]) adj[l.b].push(l.id); });
var STORE = 'ospf-explorer:layout:v1:' + (SCENE.meta.scope || 'default');
var pos = {};            // current centre of every node
var state = {
  view: { x: 0, y: 0, k: 1 },
  sel: null,             // {type:'node'|'link', id}
  focus: null,           // {nodes:[], links:[], label}
  matches: null,         // Set of node ids matching the search
  show: { oneWay: true, costs: true, ifaces: false, areas: true },
  bundle: { on: false, min: 6, expanded: {} },
  hiddenAreas: {},
  sev: { critical: true, warning: true, info: false },   // information is listed on request: it is the noisy kind
  hover: null
};

function loadSaved() {
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
  return saved;
}
function saveLayout() {
  var out = {};
  SCENE.nodes.forEach(function (n) {
    var p = pos[n.id];
    if (Math.abs(p.x - n.x) > .5 || Math.abs(p.y - n.y) > .5) out[n.id] = [Math.round(p.x), Math.round(p.y)];
  });
  try { if (Object.keys(out).length) localStorage.setItem(STORE, JSON.stringify(out)); else localStorage.removeItem(STORE); } catch (e) { /* private mode */ }
}
function resetPositions(useSaved) {
  var saved = useSaved ? loadSaved() : {};
  SCENE.nodes.forEach(function (n) {
    var s = saved[n.id];
    pos[n.id] = s ? { x: s[0], y: s[1] } : { x: n.x, y: n.y };
  });
}

// ------------------------------------------------------------------ svg helpers
function svg(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
var canvas = $('canvas'), gAreas = $('areas'), gLinks = $('links'), gLabels = $('labels'), gNodes = $('nodes'), vp = $('vp');
var els = { nodes: {}, links: {}, areas: {} };

// ------------------------------------------------------------------ bundles
function isProblem(id) {
  var n = nodes[id];
  if (n.stale || n.status) return true;
  return adj[id].some(function (lid) { var s = links[lid].state; return s && s !== 'Full'; });
}
function computeBundles() {
  var out = {};
  if (!state.bundle.on) return out;
  var inFocus = {};
  if (state.focus) state.focus.nodes.forEach(function (i) { inFocus[i] = 1; });
  if (state.matches) state.matches.forEach(function (i) { inFocus[i] = 1; });
  if (state.sel && state.sel.type === 'node') inFocus[state.sel.id] = 1;
  var onTrace = {};
  if (SCENE.trace) SCENE.trace.paths.forEach(function (p) { p.forEach(function (i) { onTrace[i] = 1; }); });
  SCENE.nodes.forEach(function (hub) {
    if (hub.kind === 'router' || state.bundle.expanded[hub.id]) return;
    var members = [];
    adj[hub.id].forEach(function (lid) {
      var l = links[lid], other = l.a === hub.id ? l.b : l.a, o = nodes[other];
      if (!o || o.kind !== 'router' || l.oneWay || l.status === 'removed') return;
      if (inFocus[other] || onTrace[other] || isProblem(other)) return;
      var real = adj[other].filter(function (x) { return !links[x].oneWay && links[x].status !== 'removed'; });
      if (real.length === 1 && (o.areas[0] === hub.areas[0])) members.push(other);
    });
    if (members.length >= state.bundle.min) out[hub.id] = members.sort();
  });
  return out;
}

// ------------------------------------------------------------------ geometry
function half(n) { return { w: n.w / 2, h: n.h / 2 }; }
function boundary(n, toward) {
  // where the line from the centre of n towards `toward` leaves the shape of n
  var c = pos[n.id], dx = toward.x - c.x, dy = toward.y - c.y;
  if (!dx && !dy) return { x: c.x, y: c.y };
  var hw = n.w / 2, hh = n.h / 2, t;
  if (n.kind === 'router' || n.kind === 'bundle') t = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9));
  else t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh);
  return { x: c.x + dx * t, y: c.y + dy * t };
}
function endpoints(l) {
  var a = l.na, b = l.nb;
  var pa = boundary(a, pos[b.id]), pb = boundary(b, pos[a.id]);
  return { pa: pa, pb: pb, ang: Math.atan2(pb.y - pa.y, pb.x - pa.x) };
}

// ------------------------------------------------------------------ colours and widths
function linkStyle(l) {
  var color = C.link, width = l.kind === 'segment' ? 1.9 : 2.3, dash = null, opacity = 1;
  var st = stateColor(l.state);
  if (st) { color = st; width = l.state === 'Full' ? 2.6 : 3.6; }
  if (l.status === 'added') { color = C.added; width = 3.4; }
  if (l.status === 'changed') { color = C.changed; width = 3.2; }
  if (l.state && l.state !== 'Full') { color = stateColor(l.state); width = 3.6; }
  if (l.status === 'removed') { color = C.removed; dash = '8 6'; width = 2.4; }
  if (l.oneWay && l.status !== 'removed') { color = C.oneway; dash = '3 6'; width = 1.6; opacity = .5; }
  else if (l.unverified && !st && !l.status) { color = C.unverified; dash = '7 5'; }
  if (l.virtual) { color = C.path; width = 3 + Math.min(5, Math.log2(l.count)); }
  return { color: color, width: width, dash: dash, opacity: opacity };
}
function onTrace(l) { return SCENE.trace && SCENE.trace.links.indexOf(l.id) >= 0; }

// ------------------------------------------------------------------ build the picture
var model = { nodes: [], links: [], bundles: {} };
function buildModel() {
  var bundles = computeBundles(), hidden = {};
  Object.keys(bundles).forEach(function (h) { bundles[h].forEach(function (m) { hidden[m] = h; }); });
  var vn = [], vl = [];
  SCENE.nodes.forEach(function (n) {
    if (hidden[n.id]) return;
    if (n.areas.length && n.areas.every(function (a) { return state.hiddenAreas[a]; })) return;
    vn.push(n);
  });
  var vis = {}; vn.forEach(function (n) { vis[n.id] = n; });
  Object.keys(bundles).forEach(function (h) {
    if (!vis[h]) return;
    var members = bundles[h];
    var b = { id: 'bundle:' + h, kind: 'bundle', hub: h, members: members, title: '\u00d7' + members.length + ' routers', sub: ['click to expand'], areas: nodes[h].areas, w: 150, h: 52, x: 0, y: 0 };
    vn.push(b); vis[b.id] = b;
    var l = { id: 'bundle-link:' + h, a: b.id, b: h, kind: 'segment', virtual: true, count: members.length, ends: [], oneWay: false, state: null, status: null };
    vl.push(l);
  });
  SCENE.links.forEach(function (l) {
    if (!vis[l.a] || !vis[l.b]) return;
    if (l.oneWay && !state.show.oneWay) return;
    vl.push(l);
  });
  vl.forEach(function (l) { l.na = vis[l.a]; l.nb = vis[l.b]; });
  model = { nodes: vn, links: vl, bundles: bundles };
  Object.keys(bundles).forEach(function (h) { placeBundle(h); });
}
function placeBundle(h) {
  var members = model.bundles[h], b = null;
  model.nodes.forEach(function (n) { if (n.id === 'bundle:' + h) b = n; });
  if (!b) return;
  var hub = pos[h], cx = 0, cy = 0;
  members.forEach(function (m) { cx += pos[m].x; cy += pos[m].y; });
  cx /= members.length; cy /= members.length;
  pos[b.id] = { x: cx, y: cy };
  if (Math.abs(cx - hub.x) + Math.abs(cy - hub.y) < 40) pos[b.id] = { x: hub.x, y: hub.y + 200 };
}

function render() {
  buildModel();
  gAreas.textContent = gLinks.textContent = gLabels.textContent = gNodes.textContent = '';
  els = { nodes: {}, links: {}, areas: {} };

  if (state.show.areas) {
    SCENE.areas.forEach(function (a) {
      if (state.hiddenAreas[a.id]) return;

  box.className = ''; $('sel-clear').onclick = clearSelection;
}
function focusOn(label, nodeIds, linkIds) {
  var ids = nodeIds.filter(function (i) { return nodes[i]; });
  state.focus = { label: label, nodes: ids, links: linkIds || [] };
  state.sel = null; $('sel').className = 'hidden';
  var hidden = false;
  if (state.bundle.on) ids.forEach(function (i) { if (!model.nodes.some(function (n) { return n.id === i; })) hidden = true; });
  if (hidden) render(); else { applyDim(); placeLabels(); }
  if (ids.length) fit(ids, 1.25);

}

// ------------------------------------------------------------------ search
function runSearch(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) { state.matches = null; if (state.bundle.on) render(); else applyDim(); return []; }
  var hits = [];
  SCENE.nodes.forEach(function (n) {
    var hay = [n.id, n.title, n.name || '', n.prefix || '', n.areas.join(' '), n.prefixes.join(' ')].join(' ').toLowerCase();
    if (hay.indexOf(q) >= 0) hits.push(n.id);
  });
  state.matches = new Set(hits);
  if (state.bundle.on) render(); else applyDim();
  return hits;
}
$('q').addEventListener('input', function (ev) { runSearch(ev.target.value); });
$('q').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') { var hits = runSearch(ev.target.value); if (hits.length) fit(hits, 1.25); else toast('No match'); }
  if (ev.key === 'Escape') { ev.target.value = ''; runSearch(''); ev.target.blur(); }
});

// ------------------------------------------------------------------ sidebar
function card(cls, icon, title, sub, onclick) {
  var b = document.createElement('button'); b.className = 'card ' + cls;
  b.innerHTML = '<span class="ico">' + icon + '</span><span>' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>';
  if (onclick) b.addEventListener('click', onclick);
  return b;
}
function buildDiagnostics() {
  var d = SCENE.diagnostics, box = $('diag'); box.textContent = '';
  if (d.split) {
    var small = []; d.split.groups.slice(1).forEach(function (g) { small = small.concat(g); });
    box.appendChild(card('crit', '\u26a0', 'Topology Split Detected (' + d.split.parts + ' parts)', d.split.groups.map(function (g) { return g.length + ' nodes'; }).join(' + '), function () { focusOn('Disconnected part(s): ' + small.length + ' node(s)', small, []); }));
  }
  if (d.oneWay.length) box.appendChild(card('orange', '\u26a0', d.oneWay.length + ' One-way Links', 'advertised by one end only', function () {
    var ns = []; d.oneWay.forEach(function (id) { ns.push(links[id].a, links[id].b); }); focusOn(d.oneWay.length + ' one-way links', ns, d.oneWay); }));
  if (d.stale.length) box.appendChild(card('warn', '\u26a0', d.stale.length + ' Stale Router' + (d.stale.length > 1 ? 's' : ''), 'LSA no longer refreshed', function () { focusOn('Stale: ' + d.stale.join(', '), d.stale, []); }));
  if (d.unverified.length) box.appendChild(card('plain', '\u25cb', d.unverified.length + ' Unverified Links', 'far end not described', function () {
    var ns = []; d.unverified.forEach(function (id) { ns.push(links[id].a, links[id].b); }); focusOn(d.unverified.length + ' unverified links', ns, d.unverified); }));
  if (d.adjacency.length) box.appendChild(card('crit', '\u2716', d.adjacency.length + ' Adjacency Problem' + (d.adjacency.length > 1 ? 's' : ''), 'neighbour not Full', function () {
    var ns = []; d.adjacency.forEach(function (i) { ns = ns.concat(i.focus); }); focusOn('Adjacency problems', ns, []); }));
  d.suspect.forEach(function (r) { box.appendChild(card('crit', '\u2716', 'Suspect run', r, null)); });
  if (d.flushing && d.flushing.length) {
    var names = d.flushing.slice(0, 3).map(function (e) { return e.type + ' ' + String(e.id).replace(/^net-/, '') + ' (age ' + e.age + ' s)'; }).join(', ');
    var info = card('info', '\u2139', d.flushing.length + ' LSA' + (d.flushing.length > 1 ? 's' : '') + ' about to age out (ignored)',
      names + (d.flushing.length > 3 ? ', +' + (d.flushing.length - 3) + ' more' : '') + ' \u2014 left out of the topology, as OSPF itself does', null);
    info.title = d.flushing.map(function (e) { return e.type + ' ' + e.id + ' area ' + e.area + ' age ' + e.age + ' s' + ((e.prefixes || []).length ? ' ' + e.prefixes.join(', ') : ''); }).join('\n');
    box.appendChild(info);
  }
  var c = d.changes;
  if (c.baseline) {
    var bits = [];
    if (c.addedNodes.length) bits.push('+' + c.addedNodes.length + ' node' + (c.addedNodes.length > 1 ? 's' : ''));
    if (c.removedNodes.length) bits.push('\u2212' + c.removedNodes.length + ' node' + (c.removedNodes.length > 1 ? 's' : ''));
    if (c.addedLinks) bits.push('+' + c.addedLinks + ' link' + (c.addedLinks > 1 ? 's' : ''));
    if (c.removedLinks) bits.push('\u2212' + c.removedLinks + ' link' + (c.removedLinks > 1 ? 's' : ''));
    if (c.metricChanges) bits.push(c.metricChanges + ' metric change' + (c.metricChanges > 1 ? 's' : ''));
    box.appendChild(bits.length ? card('info', '\u0394', 'Changes since last run', bits.join('  '), function () {
      var ns = c.addedNodes.concat(c.removedNodes); var ls = SCENE.links.filter(function (l) { return l.status; }).map(function (l) { return l.id; });
      ls.forEach(function (id) { ns.push(links[id].a, links[id].b); }); focusOn('Changes since last run', ns, ls); }) : card('plain', '\u2714', 'No changes since last run', '', null));
  }
  if (!box.children.length) box.appendChild(card('plain', '\u2714', 'No diagnostics', 'the LSDB looks consistent', null));
  var t = SCENE.trace, tb = $('trace'); tb.textContent = '';
  if (t) {
    tb.innerHTML = '<h3>Path trace</h3>';
    tb.appendChild(card('info', '\u279c', t.query + ' from ' + t.source, (t.prefix || 'no route') + (t.cost != null ? ' \u00b7 SPF cost ' + t.cost : '') + ' \u00b7 ' + t.verdict, function () {
      var ns = []; t.paths.forEach(function (p) { ns = ns.concat(p); }); focusOn('Traced path', ns, t.links); }));
  }
}
var KIND_TITLE = { ADJ_NOT_FULL: 'LSDB adjacency vs neighbour state', ADJ_MISSING: 'LSDB adjacency, neighbour missing', NBR_NOT_IN_LSDB: 'Neighbour not in LSDB', NBR_STATE_CHANGE: 'Neighbour flap / state change', NBR_LOST: 'Neighbour lost', NBR_NEW: 'New neighbour',
  ROUTE_MISSING: 'Route missing from RIB (blackhole)', NEXTHOP_DOWN: 'Next hop via non-Full neighbour', ROUTE_STALE: 'Stale route (no LSA)', RIB_EMPTY: 'RIB empty', ROUTE_OVERRIDDEN: 'Route overridden', COST_MISMATCH: 'RIB cost differs from SPF', NEXTHOP_MISMATCH: 'Next hop off the shortest path', ECMP_MISSING: 'ECMP path missing' };
function buildFindings() {
  var chips = $('sevchips'), box = $('findings'); chips.textContent = box.textContent = '';
  var counts = { critical: 0, warning: 0, info: 0 };
  SCENE.findings.forEach(function (f) { counts[f.severity] = (counts[f.severity] || 0) + 1; });
  if (!SCENE.findings.length) { box.innerHTML = '<div class="k" style="color:var(--muted)">No neighbour / routing-table findings (or that data was not collected).</div>'; return; }
  ['critical', 'warning', 'info'].forEach(function (s) {
    if (!counts[s]) return;
    var c = document.createElement('span'); c.className = 'chip' + (state.sev[s] ? '' : ' off'); c.innerHTML = '<span class="dot ' + s + '" style="display:inline-block;margin:0 5px 0 0"></span>' + counts[s] + ' ' + s;
    c.addEventListener('click', function () { state.sev[s] = !state.sev[s]; buildFindings(); }); chips.appendChild(c);
  });
  var groups = {};
  SCENE.findings.forEach(function (f) { if (state.sev[f.severity]) (groups[f.kind] = groups[f.kind] || []).push(f); });
  Object.keys(groups).sort(function (a, b) { return Math.min.apply(null, groups[a].map(function (f) { return { critical: 0, warning: 1, info: 2 }[f.severity]; })) - Math.min.apply(null, groups[b].map(function (f) { return { critical: 0, warning: 1, info: 2 }[f.severity]; })) || (a < b ? -1 : 1); }).forEach(function (kind) {
    var det = document.createElement('details'); det.className = 'group';
    var worst = groups[kind].some(function (f) { return f.severity === 'critical'; }) ? 'critical' : groups[kind].some(function (f) { return f.severity === 'warning'; }) ? 'warning' : 'info';
    det.innerHTML = '<summary><span class="dot ' + worst + '" style="margin:0"></span><span>' + esc(KIND_TITLE[kind] || kind) + '</span><span class="n">' + groups[kind].length + '</span></summary>';
    groups[kind].forEach(function (f) {
      var b = document.createElement('button'); b.className = 'row'; b.title = f.hint || '';
      b.innerHTML = '<span class="dot ' + f.severity + '"></span><span>' + esc(f.message) + (f.hint ? '<br><span style="color:var(--muted)">' + esc(f.hint) + '</span>' : '') + '</span>';
      b.addEventListener('click', function () { focusOn(f.kind + ': ' + (f.subject || ''), f.focus, []); });
      det.appendChild(b);
    });
    box.appendChild(det);
  });
}
function buildLegend() {
  var rows = [['<i style="border-color:' + C.full + '"></i>', 'Adjacency Full'], ['<i style="border-color:' + C.twoway + '"></i>', '2-Way (normal between DROthers)'],
    ['<i style="border-color:' + C.stuck + '"></i>', 'ExStart / Exchange / Loading'], ['<i style="border-color:' + C.down + '"></i>', 'Init / Down'],
    ['<i class="dot2" style="border-color:' + C.oneway + '"></i>', 'One-way link (not advertised back)'], ['<i class="dash" style="border-color:' + C.unverified + '"></i>', 'Unverified link'],
    ['<i style="border-color:' + C.added + '"></i>', 'New since last run'], ['<i class="dash" style="border-color:' + C.removed + '"></i>', 'Removed since last run'],
    ['<i style="border-color:' + C.changed + '"></i>', 'Cost changed'], ['<i style="border-color:' + C.path + ';border-top-width:5px"></i>', 'Traced path'],
    ['<b style="background:' + C.router + '"></b>', 'Router (gold edge = ABR)'], ['<b style="background:' + C.net + ';clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></b>', 'Transit network (DR below)'],
    ['<b style="background:' + C.ghostFill + ';clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></b>', 'Network with no LSA']];
  $('legend').innerHTML = rows.map(function (r) { return '<span>' + r[0] + '</span><span>' + r[1] + '</span>'; }).join('');
}
function buildHeader() {
  var m = SCENE.meta, when = m.generated.replace('T', ' ').replace(/(\+00:00|Z)$/, '');
  $('summary').textContent = 'Network View: ' + m.routers + ' Routers | ' + m.networks + ' Transit | ' + m.links + ' Links | ' + when;
  var list = $('f-arealist'); list.textContent = '';

    l.firstChild.addEventListener('change', function (ev) { state.hiddenAreas[a] = !ev.target.checked; render(); });
    list.appendChild(l);
  });
}

// ------------------------------------------------------------------ toolbar
var toastTimer = null;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2600); }
function togglePanel(id) { ['p-filter', 'p-more'].forEach(function (p) { var e = $(p); if (p === id) e.classList.toggle('hidden'); else e.classList.add('hidden'); }); }
$('b-filter').onclick = function () { togglePanel('p-filter'); };
$('b-more').onclick = function () { togglePanel('p-more'); };
$('b-search').onclick = function () { $('q').focus(); };
$('b-side').onclick = function () { $('side').classList.toggle('collapsed'); setTimeout(function () { fit(); }, 30); };
$('b-full').onclick = function () { var d = document; if (d.fullscreenElement) d.exitFullscreen(); else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen(); };
$('b-zin').onclick = function () { var s = stageSize(); zoomAt(1.3, s.w / 2, s.h / 2); };
$('b-zout').onclick = function () { var s = stageSize(); zoomAt(1 / 1.3, s.w / 2, s.h / 2); };
$('b-fit').onclick = function () { fit(); };
$('b-reset').onclick = function () { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } resetPositions(false); render(); fit(); toast('Layout reset'); };
$('f-oneway').onchange = function (e) { state.show.oneWay = e.target.checked; render(); };
$('f-costs').onchange = function (e) { state.show.costs = e.target.checked; placeLabels(); };
$('f-ifaces').onchange = function (e) { state.show.ifaces = e.target.checked; placeLabels(); };
$('f-areas').onchange = function (e) { state.show.areas = e.target.checked; render(); };
$('f-bundle').onchange = function (e) { state.bundle.on = e.target.checked; state.bundle.expanded = {}; render(); };
$('f-bundlemin').onchange = function (e) { state.bundle.min = Math.max(2, parseInt(e.target.value, 10) || 6); state.bundle.expanded = {}; render(); };
function download(name, text, type) {
  var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: type }));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 500);
}
$('m-export').onclick = function () {
  var out = {}; SCENE.nodes.forEach(function (n) { out[n.id] = [Math.round(pos[n.id].x), Math.round(pos[n.id].y)]; });
  download('ospf-layout.json', JSON.stringify({ scope: SCENE.meta.scope, positions: out }, null, 1), 'application/json');
};
$('m-import').onclick = function () { $('m-file').click(); };
$('m-file').onchange = function (ev) {

    } catch (e) { toast('Not a layout file'); }
  };

};
$('m-svg').onclick = function () {
  var b = bounds(), pad = 40, clone = canvas.cloneNode(true);
  clone.setAttribute('viewBox', [b.x0 - pad, b.y0 - pad, b.x1 - b.x0 + 2 * pad, b.y1 - b.y0 + 2 * pad].join(' '));
  clone.setAttribute('width', Math.round(b.x1 - b.x0 + 2 * pad)); clone.setAttribute('height', Math.round(b.y1 - b.y0 + 2 * pad));
  clone.querySelector('#vp').removeAttribute('transform'); clone.removeAttribute('style');
  var bg = document.createElementNS(NS, 'rect'); bg.setAttribute('x', b.x0 - pad); bg.setAttribute('y', b.y0 - pad); bg.setAttribute('width', b.x1 - b.x0 + 2 * pad); bg.setAttribute('height', b.y1 - b.y0 + 2 * pad); bg.setAttribute('fill', C.exportBg);
  clone.insertBefore(bg, clone.firstChild);
  download('ospf-topology.svg', '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), 'image/svg+xml');
};
document.addEventListener('keydown', function (ev) {
  var typing = /INPUT|TEXTAREA|SELECT/.test((ev.target.tagName || ''));
  if (ev.key === '/' && !typing) { ev.preventDefault(); $('q').focus(); }
  else if (typing) return;
  else if (ev.key === 'Escape') { clearSelection(); $('p-filter').classList.add('hidden'); $('p-more').classList.add('hidden'); }
  else if (ev.key === 'f') fit();
  else if (ev.key === '+' || ev.key === '=') $('b-zin').click();
  else if (ev.key === '-') $('b-zout').click();
});
window.addEventListener('resize', function () { afterView(); });

// ------------------------------------------------------------------ theme (auto / light / dark)
var THEME_KEY = 'ospf-explorer:theme';
var THEME_ICON = { auto: '\u25d0', light: '\u2600\ufe0f', dark: '\ud83c\udf19' };
var THEME_NEXT = { auto: 'light', light: 'dark', dark: 'auto' };
var THEME_NAME = { auto: 'auto (follows the system)', light: 'light', dark: 'dark' };
var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
var ready = false;
function savedTheme() {
  try { var v = localStorage.getItem(THEME_KEY); if (v === 'light' || v === 'dark' || v === 'auto') return v; } catch (e) { /* blocked */ }
  return null;
}
function resolveTheme(pref) { return pref === 'auto' ? (media && media.matches ? 'light' : 'dark') : pref; }
function applyTheme(pref, persist) {
  state.theme = pref;
  var resolved = resolveTheme(pref);
  document.documentElement.setAttribute('data-theme', resolved);
  C = PAL[resolved];
  var b = $('b-theme');
  b.textContent = THEME_ICON[pref];
  b.title = 'Theme: ' + THEME_NAME[pref] + ' \u2014 click for ' + THEME_NAME[THEME_NEXT[pref]];
  b.setAttribute('aria-label', b.title);
  if (persist) { try { localStorage.setItem(THEME_KEY, pref); } catch (e) { /* blocked */ } }
  if (ready) { buildLegend(); render(); }   // the SVG takes its colours from the palette, so redraw
}
$('b-theme').onclick = function () { applyTheme(THEME_NEXT[state.theme], true); };
if (media) {
  var onSystemChange = function () { if (state.theme === 'auto') applyTheme('auto', false); };
  if (media.addEventListener) media.addEventListener('change', onSystemChange); else if (media.addListener) media.addListener(onSystemChange);
}

// ------------------------------------------------------------------ go
resetPositions(true);
applyTheme(savedTheme() || SCENE.meta.theme || 'auto', false);
buildHeader(); buildDiagnostics(); buildFindings(); buildLegend();
render(); fit();
ready = true;
window.__explorer = { palette: function () { return C; }, state: state, nodes: nodes, links: links, pos: pos, render: render, fit: fit, focusOn: focusOn, select: select, runSearch: runSearch, model: function () { return model; } };
})();
